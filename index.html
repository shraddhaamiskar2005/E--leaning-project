<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnHub - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
   <link rel="stylesheet" href="forms.css">

</head>
<body>
    <div class="login-container">
        <div class="logo">
            <i class="fas fa-graduation-cap"></i>
            <h1>LearnHub</h1>
        </div>
        
        <!-- Add this login form -->
        <div class="login-form" id="login-form-container" style="display: none;">
            <h2>Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" id="login-btn">Login</button>
                <div id="error-message" class="error-message"></div>
            </form>
        </div>
        
        <div class="login-options">
            <h2>Login As</h2>
            
            <div class="option-cards">
                <a href="#" class="option-card student" id="student-login">
                    <i class="fas fa-user-graduate"></i>
                    <h3>Student</h3>
                    <p>Access your courses, track progress, and view grades</p>
                </a>
                
                <a href="#" class="option-card admin" id="admin-login">
                    <i class="fas fa-user-shield"></i>
                    <h3>Admin</h3>
                    <p>Manage courses, users, and platform settings</p>
                </a>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { 
            getDatabase,
            ref,
            set,
            get
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCuHHzMxgmrXECy8sjzWkd7WysnGGVdG0E",
            authDomain: "e-learning-27cfb.firebaseapp.com",
            databaseURL: "https://e-learning-27cfb-default-rtdb.firebaseio.com",
            projectId: "e-learning-27cfb",
            storageBucket: "e-learning-27cfb.appspot.com",
            messagingSenderId: "227049131213",
            appId: "1:227049131213:web:9139cab0cfba73f1d8ad84"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Show login form when student or admin is clicked
        document.getElementById('student-login').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('login-form-container').style.display = 'block';
            currentRole = 'student';
        });

        document.getElementById('admin-login').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('login-form-container').style.display = 'block';
            currentRole = 'admin';
        });

        // Login function with data saving
        async function loginUser(email, password, role) {
            try {
                // Show loading state
                document.getElementById('login-btn').disabled = true;
                document.getElementById('login-btn').innerHTML = 'Logging in...';
                
                // Sign in with Firebase Auth
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // Save login data to Realtime Database
                const loginData = {
                    email: email,
                    role: role,
                    lastLogin: new Date().toISOString(),
                    uid: user.uid
                };
                
                // Save to both users collection and login history
                await Promise.all([
                    set(ref(db, `users/${user.uid}`), loginData),
                    set(ref(db, `loginHistory/${user.uid}/${new Date().getTime()}`), {
                        timestamp: new Date().toISOString(),
                        role: role
                    })
                ]);
                
                console.log("Login data saved successfully!");
                
                // Redirect based on role
                window.location.href = `${role}-dashboard.html`;
                
            } catch (error) {
                console.error("Login error:", error);
                document.getElementById('error-message').textContent = error.message;
                document.getElementById('error-message').style.display = 'block';
            } finally {
                document.getElementById('login-btn').disabled = false;
                document.getElementById('login-btn').innerHTML = 'Login';
            }
        }

        // Form submission handler
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = currentRole; // 'student' or 'admin'
            
            await loginUser(email, password, role);
        });

        // Track current role
        let currentRole = 'student';
    </script>
</body>
</html>
