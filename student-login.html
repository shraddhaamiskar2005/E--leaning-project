<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnHub - Student Login</title>
     <a href="dashboard.html" class="option-card student"></a>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2c3e50;
            --danger-color: #e74c3c;
            --light-color: #ecf0f1;
            --dark-color: #2c3e50;
            --success-color: #2ecc71;
            --student-color: #9b59b6;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(155, 89, 182, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(52, 152, 219, 0.1) 0%, transparent 20%);
        }
        
        .login-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            transition: transform 0.3s ease;
        }
        
        .login-container:hover {
            transform: translateY(-5px);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .logo h1 {
            color: var(--secondary-color);
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .logo i {
            color: var(--student-color);
        }
        
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .form-group label {
            font-weight: 600;
            color: var(--dark-color);
            font-size: 0.9rem;
        }
        
        .form-group input {
            padding: 0.8rem 1rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--student-color);
            box-shadow: 0 0 0 3px rgba(155, 89, 182, 0.2);
        }
        
        .password-container {
            position: relative;
        }
        
        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--dark-color);
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }
        
        .password-toggle:hover {
            opacity: 1;
        }
        
        .btn {
            padding: 0.8rem 1rem;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .student-btn {
            background-color: var(--student-color);
            color: white;
        }
        
        .student-btn:hover {
            background-color: #8e44ad;
        }
        
        .form-footer {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
            color: var(--dark-color);
        }
        
        .form-footer a {
            color: var(--student-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        
        .form-footer a:hover {
            color: #8e44ad;
            text-decoration: underline;
        }
        
        .error-message {
            color: var(--danger-color);
            font-size: 0.8rem;
            margin-top: 0.2rem;
            display: none;
        }
        
        .login-options {
            display: flex;
            justify-content: space-between;
            margin-top: 1rem;
        }
        
        .login-options a {
            font-size: 0.85rem;
        }
        
        @media (max-width: 480px) {
            .login-container {
                margin: 1rem;
                padding: 1.5rem;
            }
            
            .logo h1 {
                font-size: 1.5rem;
            }
            
            .login-options {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1><i class="fas fa-user-graduate"></i> Student Login</h1>
        </div>
        
        <form class="login-form" id="studentLoginForm">
            <div class="form-group">
                <label for="student-email">Email or Student ID</label>
                <input type="text" id="student-email" name="email" placeholder="Enter your email or student ID" required>
                <div class="error-message" id="email-error"></div>
            </div>
            
            <div class="form-group">
                <label for="student-password">Password</label>
                <div class="password-container">
                    <input type="password" id="student-password" name="password" placeholder="Enter your password" required>
                    <i class="fas fa-eye password-toggle" id="togglePassword"></i>
                </div>
                <div class="error-message" id="password-error"></div>
            </div>
            
            <div class="login-options">
                <a href="forgot-password.html">Forgot password?</a>
                <a href="register.html">Create new account</a>
            </div>
            
            <button type="submit" class="btn student-btn">Login</button>
            
            <div class="form-footer">
                <p><a href="index.html"><i class="fas fa-arrow-left"></i> Back to login options</a></p>
            </div>
        </form>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Password toggle functionality
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('student-password');
        
        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
        });
        
        // Form validation
        const loginForm = document.getElementById('studentLoginForm');
        
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Reset error messages
            document.getElementById('email-error').style.display = 'none';
            document.getElementById('password-error').style.display = 'none';
            
            // Get form values
            const email = document.getElementById('student-email').value.trim();
            const password = document.getElementById('student-password').value.trim();
            
            // Validation flags
            let isValid = true;
            
            // Email/ID validation
            if (!email) {
                document.getElementById('email-error').textContent = 'Email or Student ID is required';
                document.getElementById('email-error').style.display = 'block';
                isValid = false;
            }
            
            // Password validation
            if (!password) {
                document.getElementById('password-error').textContent = 'Password is required';
                document.getElementById('password-error').style.display = 'block';
                isValid = false;
            } else if (password.length < 6) {
                document.getElementById('password-error').textContent = 'Password must be at least 6 characters';
                document.getElementById('password-error').style.display = 'block';
                isValid = false;
            }
            
            // If form is valid, redirect to dashboard
            if (isValid) {
                // Here you would typically make an AJAX call to verify credentials
                // For this demo, we'll redirect directly
                window.location.href = 'dashboard.html';
                
                // In a real application, you would do something like:
                /*
                fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        window.location.href = 'dashboard.html';
                    } else {
                        alert('Login failed: ' + data.message);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                });
                */
            }
        });
        
        // Input field validation on blur
        document.getElementById('student-email').addEventListener('blur', function() {
            const email = this.value.trim();
            if (!email) {
                document.getElementById('email-error').textContent = 'Email or Student ID is required';
                document.getElementById('email-error').style.display = 'block';
            } else {
                document.getElementById('email-error').style.display = 'none';
            }
        });
        
        document.getElementById('student-password').addEventListener('blur', function() {
            const password = this.value.trim();
            if (!password) {
                document.getElementById('password-error').textContent = 'Password is required';
                document.getElementById('password-error').style.display = 'block';
            } else if (password.length < 6) {
                document.getElementById('password-error').textContent = 'Password must be at least 6 characters';
                document.getElementById('password-error').style.display = 'block';
            } else {
                document.getElementById('password-error').style.display = 'none';
            }
        });
    });
</script>
</body>
</html>
